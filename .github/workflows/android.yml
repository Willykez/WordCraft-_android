name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  GRADLE_VERSION: 8.10.2

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      # 1. Installs pre-compiled binaries instantly instead of compiling from source
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # 2. Fixed cache configuration to include the root workspace crates
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            android/rust

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # 3. Dropped --release for tests. Debug builds are significantly faster.
      - name: Bridge tests
        working-directory: android/rust
        run: cargo test

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # 4. Optional: Pass an argument to only build one ABI during PR checks to halve compile time
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon -PdevBuild=true

      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
