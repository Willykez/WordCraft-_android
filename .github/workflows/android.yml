
name: WordCraft Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "crates/**"
      - "assets/**"
      - "Cargo.toml"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "crates/**"
      - "assets/**"
      - "Cargo.toml"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      build_type:
        description: Which Android build to run
        required: true
        type: choice
        options:
          - debug
          - release
          - both
        default: debug

permissions:
  contents: read

concurrency:
  group: wordcraft-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  NDK_VERSION: "27.2.12479018"
  GRADLE_VERSION: "8.10.2"
  RUST_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always

jobs:

  # --------------------------------------------------
  # 1. FAST PREFLIGHT
  # --------------------------------------------------
  preflight:
    name: Fast Source Validation
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install KtLint
        run: |
          curl -fsSL \
            https://github.com/ktlint/ktlint/releases/download/1.8.0/ktlint \
            -o ktlint
          chmod +x ktlint
          sudo mv ktlint /usr/local/bin/ktlint

      - name: Kotlin formatting check
        run: |
          ktlint "android/app/src/main/kotlin/**/*.kt"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Rust formatting check
        shell: bash
        run: |
          if [ -f android/rust/Cargo.toml ]; then
            cd android/rust
            cargo fmt --all -- --check
          else
            echo "Rust workspace not found at android/rust; skipping Rust format check."
          fi

      - name: Validate Cargo metadata
        shell: bash
        run: |
          if [ -f android/rust/Cargo.toml ]; then
            cd android/rust
            cargo metadata --no-deps --format-version 1
          else
            echo "Cargo workspace not found; skipping metadata validation."
          fi

      - name: Validate workflow YAML
        run: |
          python -m pip install --quiet pyyaml
          python - <<'PY'
          import yaml
          from pathlib import Path

          for file in Path(".github/workflows").glob("*.yml"):
              with file.open() as f:
                  yaml.safe_load(f)
              print(f"Valid YAML: {file}")
          PY

  # --------------------------------------------------
  # 2. RUST TESTS (INDEPENDENT)
  # --------------------------------------------------
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            android/rust -> target
          shared-key: wordcraft-rust

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Rust tests
        shell: bash
        run: |
          if [ -f android/rust/Cargo.toml ]; then
            cd android/rust
            cargo test --workspace
          else
            echo "No Rust workspace at android/rust; skipping Rust tests."
          fi

  # --------------------------------------------------
  # 3. ANDROID DEBUG APK - ARM64
  # --------------------------------------------------
  debug:
    name: Debug APK (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: preflight

    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.build_type == 'debug' ||
      inputs.build_type == 'both'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            android/rust -> target
          shared-key: wordcraft-rust-arm64-debug

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure compiler cache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Gradle automatically invokes cargoNdk and uniffiBindgen.
      - name: Build Debug APK
        working-directory: android
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --build-cache \
            --parallel \
            -PdevBuild=true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WordCraft-Debug-ARM64
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------
  # 4. ANDROID RELEASE - FULL BUILD
  # --------------------------------------------------
  release:
    name: Release APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: preflight

    if: |
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' &&
      (inputs.build_type == 'release' || inputs.build_type == 'both')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            android/rust -> target
          shared-key: wordcraft-rust-release

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure compiler cache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ----------------------------------------
      # Release signing preparation
      # ----------------------------------------
      - name: Prepare Release Keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.WORDCRAFT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WORDCRAFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WORDCRAFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WORDCRAFT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          count=0

          for value in \
            "$KEYSTORE_BASE64" \
            "$KEYSTORE_PASSWORD" \
            "$KEY_ALIAS" \
            "$KEY_PASSWORD"
          do
            if [ -n "$value" ]; then
              count=$((count + 1))
            fi
          done

          if [ "$count" -eq 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No production signing secrets found."
            echo "Gradle will use its configured debug-signing fallback."
            exit 0
          fi

          if [ "$count" -ne 4 ]; then
            echo "ERROR: Incomplete WordCraft signing secrets."
            exit 1
          fi

          SIGNING_DIR="$RUNNER_TEMP/wordcraft-signing"
          mkdir -p "$SIGNING_DIR"

          KEYSTORE_FILE="$SIGNING_DIR/release.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "WORDCRAFT_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "configured=true" >> "$GITHUB_OUTPUT"

          echo "Production signing keystore prepared."

      # A tagged release must never silently use the debug key.
      - name: Require Production Signing For Version Tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_CONFIGURED: ${{ steps.signing.outputs.configured }}
        run: |
          if [ "$SIGNING_CONFIGURED" != "true" ]; then
            echo "ERROR: Configure all four WORDCRAFT signing secrets before publishing."
            exit 1
          fi

      # ----------------------------------------
      # Build optimized APK and AAB
      # ----------------------------------------
      - name: Build Release APK and AAB
        working-directory: android
        env:
          WORDCRAFT_KEYSTORE_FILE: ${{ env.WORDCRAFT_KEYSTORE_FILE }}
          WORDCRAFT_KEYSTORE_PASSWORD: ${{ secrets.WORDCRAFT_KEYSTORE_PASSWORD }}
          WORDCRAFT_KEY_ALIAS: ${{ secrets.WORDCRAFT_KEY_ALIAS }}
          WORDCRAFT_KEY_PASSWORD: ${{ secrets.WORDCRAFT_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease \
            --no-daemon \
            --build-cache \
            --parallel

      # ----------------------------------------
      # Verify release artifacts
      # ----------------------------------------
      - name: Verify Release Artifacts
        run: |
          set -euo pipefail

          APK=$(find android/app/build/outputs/apk/release -name "*.apk" -print -quit)
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" -print -quit)

          test -n "$APK"
          test -n "$AAB"

          echo "APK: $APK"
          echo "AAB: $AAB"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          echo "Release artifacts verified."

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: WordCraft-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: WordCraft-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # Keep R8 mapping files for crash de-obfuscation.
      - name: Upload R8 Mapping
        if: always() && hashFiles('android/app/build/outputs/mapping/release/mapping.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-r8-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup Signing Files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/wordcraft-signing"

  # --------------------------------------------------
  # 5. AUTOMATIC GITHUB RELEASE
  # --------------------------------------------------
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: release

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: WordCraft-Release-APK
          path: release/apk

      - name: Download Release AAB
        uses: actions/download-artifact@v4
        with:
          name: WordCraft-Release-AAB
          path: release/aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/apk/*.apk
            release/aab/*.aab
