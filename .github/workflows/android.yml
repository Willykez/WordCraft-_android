
name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - "crates/**"
      - "assets/**"
      - "Cargo.toml"
      - ".github/workflows/android.yml"

  pull_request:
    paths:
      - "android/**"
      - "crates/**"
      - "assets/**"
      - "Cargo.toml"
      - ".github/workflows/android.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  GRADLE_VERSION: 8.10.2
  JAVA_VERSION: "17"

jobs:

  # ============================================
  # DEBUG BUILD + RUST TESTS
  # ============================================
  debug:
    name: Debug Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/rust

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Rust Tests
        working-directory: android/rust
        run: cargo test

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Gradle automatically invokes cargoNdk and uniffiBindgen.
      - name: Build Debug APK
        working-directory: android
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            -PdevBuild=true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # OPTIMIZED PRODUCTION RELEASE
  # ============================================
  release:
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/rust

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ----------------------------------------
      # Release signing preparation
      # ----------------------------------------
      - name: Prepare Release Keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.WORDCRAFT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WORDCRAFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WORDCRAFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WORDCRAFT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          count=0

          for value in \
            "$KEYSTORE_BASE64" \
            "$KEYSTORE_PASSWORD" \
            "$KEY_ALIAS" \
            "$KEY_PASSWORD"
          do
            if [ -n "$value" ]; then
              count=$((count + 1))
            fi
          done

          if [ "$count" -eq 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No production signing secrets found."
            echo "Gradle will use its configured debug-signing fallback."
            exit 0
          fi

          if [ "$count" -ne 4 ]; then
            echo "ERROR: Incomplete WordCraft signing secrets."
            exit 1
          fi

          SIGNING_DIR="$RUNNER_TEMP/wordcraft-signing"
          mkdir -p "$SIGNING_DIR"

          KEYSTORE_FILE="$SIGNING_DIR/release.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore is empty."
            exit 1
          fi

          echo "WORDCRAFT_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "configured=true" >> "$GITHUB_OUTPUT"

          echo "Production signing keystore prepared."

      # A tagged release must never silently use the debug key.
      - name: Require Production Signing For Version Tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_CONFIGURED: ${{ steps.signing.outputs.configured }}
        run: |
          if [ "$SIGNING_CONFIGURED" != "true" ]; then
            echo "ERROR: Configure all four WORDCRAFT signing secrets before publishing."
            exit 1
          fi

      # ----------------------------------------
      # Build optimized APK and AAB
      # ----------------------------------------
      - name: Build Release APK and AAB
        working-directory: android
        env:
          WORDCRAFT_KEYSTORE_FILE: ${{ env.WORDCRAFT_KEYSTORE_FILE }}
          WORDCRAFT_KEYSTORE_PASSWORD: ${{ secrets.WORDCRAFT_KEYSTORE_PASSWORD }}
          WORDCRAFT_KEY_ALIAS: ${{ secrets.WORDCRAFT_KEY_ALIAS }}
          WORDCRAFT_KEY_PASSWORD: ${{ secrets.WORDCRAFT_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease \
            --no-daemon

      # ----------------------------------------
      # Verify release artifacts
      # ----------------------------------------
      - name: Verify Release Artifacts
        run: |
          set -euo pipefail

          APK=$(find android/app/build/outputs/apk/release -name "*.apk" -print -quit)
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" -print -quit)

          test -n "$APK"
          test -n "$AAB"

          echo "APK: $APK"
          echo "AAB: $AAB"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          echo "Release artifacts verified."

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # Keep R8 mapping files for crash de-obfuscation.
      - name: Upload R8 Mapping
        if: always() && hashFiles('android/app/build/outputs/mapping/release/mapping.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-r8-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup Signing Files
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/wordcraft-signing"

  # ============================================
  # AUTOMATIC GITHUB RELEASE
  # ============================================
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: release

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: wordcraft-android-release-apk
          path: release/apk

      - name: Download Release AAB
        uses: actions/download-artifact@v4
        with:
          name: wordcraft-android-release-aab
          path: release/aab

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/apk/*.apk
            release/aab/*.aab
